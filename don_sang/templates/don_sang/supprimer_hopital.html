{% extends 'don_sang/base.html' %}
{% block title %}Supprimer — {{ hopital.nom }}{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-5">
      <div class="card border-danger">
        <div class="card-header bg-danger text-white">
          <h5 class="mb-0"><i class="bi bi-trash me-2"></i> Confirmer la suppression</h5>
        </div>
        <div class="card-body text-center p-4">
          <div style="font-size:3rem;">🏥</div>
          <p class="mt-3">Voulez-vous vraiment supprimer l'hôpital :</p>
          <p class="fw-bold fs-5 text-danger">{{ hopital.nom }}</p>
          <p class="text-muted small">{{ hopital.ville }}</p>
          <form method="post" class="d-flex gap-2 justify-content-center mt-4">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger px-4">
              <i class="bi bi-trash me-1"></i> Supprimer
            </button>
            <a href="{% url 'liste_hopitaux' %}" class="btn btn-outline-secondary">Annuler</a>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
