{% extends 'don_sang/base.html' %}
{% block title %}Modifier un don{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7">
      <div class="card shadow-sm">
        <div class="card-header text-white text-center py-3" style="background: linear-gradient(135deg,#2980b9,#3498db); border-radius:16px 16px 0 0;">
          <h4 class="mb-0">✏️ Modifier mon don</h4>
        </div>
        <div class="card-body p-4">
          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label fw-semibold">Groupe sanguin</label>
              {{ form.groupe_sanguin }}
            </div>
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold">Ville</label>
                {{ form.ville }}
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Téléphone</label>
                {{ form.telephone }}
              </div>
            </div>
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold">Âge</label>
                {{ form.age }}
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Disponibilité</label>
                {{ form.disponibilite }}
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Message</label>
              {{ form.message }}
            </div>
            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary btn-lg">💾 Enregistrer les modifications</button>
              <a href="{% url 'mes_dons' %}" class="btn btn-outline-secondary">Annuler</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
