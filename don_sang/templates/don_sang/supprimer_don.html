{% extends 'don_sang/base.html' %}
{% block title %}Supprimer un don{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm text-center">
        <div class="card-body p-4">
          <div style="font-size:3rem;">🗑️</div>
          <h5 class="fw-bold mt-2">Confirmer la suppression</h5>
          <p class="text-muted">Voulez-vous supprimer le don <strong>{{ don.groupe_sanguin }}</strong> du <strong>{{ don.date_don }}</strong> ?</p>
          <form method="post" class="d-flex gap-2 justify-content-center mt-3">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Oui, supprimer</button>
            <a href="{% url 'mes_dons' %}" class="btn btn-outline-secondary">Annuler</a>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
