{% extends 'don_sang/base.html' %}
{% block title %}Ajouter un hôpital{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="card">
        <div class="card-header bg-danger text-white">
          <h5 class="mb-0"><i class="bi bi-hospital me-2"></i> Ajouter un hôpital</h5>
        </div>
        <div class="card-body p-4">
          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label fw-semibold">Nom de l'hôpital</label>
              {{ form.nom }}
            </div>
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold">Ville</label>
                {{ form.ville }}
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Téléphone</label>
                {{ form.telephone }}
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Adresse</label>
              {{ form.adresse }}
            </div>
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold">Email</label>
                {{ form.email }}
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Capacité (poches de sang)</label>
                {{ form.capacite }}
              </div>
            </div>
            <div class="d-flex gap-2 mt-4">
              <button type="submit" class="btn btn-blood px-4">
                <i class="bi bi-check-circle me-1"></i> Enregistrer
              </button>
              <a href="{% url 'liste_hopitaux' %}" class="btn btn-outline-secondary">Annuler</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
